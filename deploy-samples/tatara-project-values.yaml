# Sample values for the tatara-project chart: a full GitHub project codified
# declaratively, exercising the agent-customization fields the Project CRD
# exposes on current main.
#
#   helm install tatara charts/tatara-project -n tatara -f deploy-samples/tatara-project-values.yaml
#
# The tatara-scm Secret (key: token) must already exist in the namespace; it is
# supplied by the helmfile (sops), not this chart.

namespace: tatara

project:
  name: tatara
  spec:
    scmSecretRef: tatara-scm
    triggerLabel: tatara
    maxConcurrentTasks: 3
    maxOpenTasks: 4
    agent:
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:latest
      model: claude-opus-5
      permissionMode: bypassPermissions
      maxTurnsPerTask: 100
      turnTimeoutSeconds: 1800
      effort: high
      # --- per-project agent customization (current main CRD) ---
      extraEnvs:
        - name: EXAMPLE_FLAG
          value: "on"
        - name: EXAMPLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: example-extra-secret
              key: token
      # Supply a custom prompt / MCP overlay / skills by mounting ConfigMaps
      # onto the wrapper's PROJECT_CLAUDE_MD_PATH, MCP_OVERLAY_DIR and
      # SKILLS_SRC_DIRS via extraVolumes + extraVolumeMounts.
      extraVolumes:
        - name: skills
          configMap:
            name: skill-deploy
      extraVolumeMounts:
        - name: skills
          mountPath: /etc/wrapper/skills/deploy
      hooks:
        conversationStart: "echo 'agent conversation starting'"
      # skillSources: extra skill repositories the wrapper clones and installs
      # skills from, into every agent pod (alongside the baked
      # tatara-agent-skills). Auth reuses the project's scmSecretRef token via
      # the wrapper's global GIT_TOKEN credential helper.
      # skillSources:
      #   - name: example-skills
      #     url: https://github.com/szymonrychu/example-skills
      #     ref: main
      #     subdir: .claude/skills
      # promptAppendByKind: project-specific text appended AFTER the built-in
      # per-kind assignment prompt. "*" is appended to every kind BEFORE that
      # kind's own entry.
      # promptAppendByKind:
      #   "*": "All work in this repo MUST go through its own workflow skills."
      #   review: "As reviewer, be critical but fair."
    memory:
      pgInstances: 1
      pgStorage: 10Gi
      neo4jStorage: 10Gi
    workspace:
      enabled: true
      storageClass: rook-ceph-rwx
      size: 10Gi
      cacheEnabled: true
      cacheSize: 50Gi
    scm:
      provider: github
      owner: szymonrychu
      botLogin: szymonrychu-bot
      priorityLabel: tatara/priority
      cron:
        issueScan:
          schedule: "0 * * * *"
          maxPerRepo: 1
        brainstorm:
          enabled: true
          schedule: "0 * * * *"
          targetOpenProposals: 3
          historyWindow: 20
          sources: [docs, memory, internet]
        # The dependency-upgrade cron. DEFAULT OFF: an empty schedule disables
        # it, and enabling it lets an agent open merge requests that change
        # deployed versions, so it is opt-in per project here. Each due tick
        # mints AT MOST ONE upgrade Task - throughput is the cron FREQUENCY, not
        # a fan-out.
        #
        # THERE IS NO `enabled` FLAG HERE, unlike brainstorm above: the empty
        # (or absent) schedule IS the off switch. Do not add one - this chart
        # renders project.spec verbatim and the API server PRUNES unknown
        # fields silently, so an `enabled: false` next to a live schedule would
        # be dropped and the cron would run anyway.
        #
        # maxOpenUpgrades caps the concurrent open upgrade lanes (live upgrade
        # Tasks plus enqueued-but-unminted events). SET IT EXPLICITLY: a CRD
        # default is applied on WRITE and never retroactively, so raising it
        # later does not reach a Project CR that already exists.
        upgrade:
          schedule: ""
          maxOpenUpgrades: 2
          # To opt in, replace the empty schedule above with a real one:
          # schedule: "0 */4 * * *"
    # Policy the upgrade agent is HANDED in its turn-0 assignment; the operator
    # renders it, never acts on it. Only read when scm.cron.upgrade is enabled.
    #   engine        - renovate | none. renovate runs the Renovate CLI
    #                   read-only in the pod and its report is a HINT; none
    #                   means the agent enumerates candidates itself.
    #   majorStrategy - nextHopOnly | latest. nextHopOnly walks a multi-hop
    #                   chain one deployed Task at a time; the repo's current
    #                   pin IS the cursor, no chain state is persisted.
    #   minimumReleaseAge - days a release must have been published before it
    #                   may be proposed, per semver level. 0 is bleeding edge.
    upgradePolicy:
      engine: none
      majorStrategy: nextHopOnly
      minimumReleaseAge:
        major: 7
        minor: 3
        patch: 0

repositories:
  - name: tatara-operator
    spec:
      url: https://github.com/szymonrychu/tatara-operator
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: tatara-claude-code-wrapper
    spec:
      url: https://github.com/szymonrychu/tatara-claude-code-wrapper
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "0 6 * * *"

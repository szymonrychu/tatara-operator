{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tatara-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tatara-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: tatara-loop
      rules:
        # ---- Class A: deadman / liveness (catch silent stalls that emit no event) ----
        - alert: TataraOperatorDown
          expr: up{job=~".*tatara-operator.*"} == 0
          for: 5m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "tatara-operator is not being scraped"
            description: "No tatara-operator scrape target has reported up for 5m. The autonomous loop's controller is down or its ServiceMonitor is mis-wired; none of the counter-based alerts below can fire while this is true."
        - alert: TataraLoopWedged
          expr: sum(increase(operator_reconcile_total[15m])) == 0
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "tatara-operator reconciled nothing for 15m"
            description: "operator_reconcile_total has not increased for any kind in 15m while the operator is up: the workqueue is wedged even though the pod is alive."
        - alert: TataraLoopStalled
          expr: |
            sum(increase(operator_tasks_minted_per_sweep_count[3h])) == 0
          for: 30m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the tatara B.4 sweep produced no activity for 3h"
            description: "The B.4 sweep has not run a single pass in 3h. The loop is silently processing nothing with zero errors (the worst failure class). operator_tasks_minted_per_sweep_count is the primary term (not the old tatara_scan_* pair, pruned as dead-per-redesign - metric-wiring audit, issue #370): since the task-centric redesign the SWEEP is the sole intake, and it observes that histogram on EVERY pass including a zero-mint one and including a FAILING one - the same liveness moment TataraSweepStalled's heartbeat gauge is stamped at (both are written together in SweepProject): 'the pass ran to completion', not 'completed cleanly' (issue #325). Both alerts are still needed, but not for a clean-vs-any distinction: this one sums the histogram globally with no project/activity grouping over a fixed 3h window, a config-free operator-wide backstop; TataraSweepStalled is grouped by (project, activity) against a tunable staleness threshold, so it alone catches one project's sweep going dark while its siblings stay healthy (issue #441), and it alone is rehydrated from the Project CR on every reconcile (fix #386) so it survives a pod restart, which this in-memory histogram has no equivalent for. A stalled brainstorm/documentation cron specifically (opt-in, slower cadences) is NOT this alert's job - it is a narrower, lower-severity signal than 'the loop stopped', and a dedicated per-activity alert on the new obs.SweepLastSuccessTimestamp{activity=brainstorm|documentation} gauge is tracked as a ROADMAP follow-up rather than folded into this deadman."
        - alert: TataraMemoryStackFailed
          expr: operator_memory_stacks{phase="Failed"} > 0
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a per-project memory stack is Failed"
            description: "Project {{ "{{" }} $labels.project {{ "}}" }}'s memory stack has been in phase Failed for 15m. The lightrag/neo4j/postgres backing that project's recall is degraded. Since issue #425 operator_memory_stacks carries a project label, so this alert fires once per affected project and names it instead of reporting an anonymous cluster-wide count."
        - alert: TataraMemoryStackDegraded
          expr: operator_memory_stacks{phase="Degraded"} > 0
          for: 5m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a per-project memory stack is stuck Provisioning past its timeout"
            description: "Project {{ "{{" }} $labels.project {{ "}}" }}'s memory stack has been reported Degraded (issue #355): the stack has sat phase=Provisioning longer than the memoryProvisioningTimeoutMinutes bound (default 45m) with no backend converging to Ready. The MemoryReady condition's message on the Project carries how long it has been stuck. The 5m for-window rides out a single scrape/reconcile-cycle flap; the gauge itself only flips once the reconcile-side timeout has already elapsed."
        - alert: TataraTasksInflightPinned
          expr: operator_tasks_inflight >= {{ .Values.prometheusRule.tasksInflightThreshold }}
          for: 2h
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "in-flight Tasks pinned at the concurrency cap"
            description: "operator_tasks_inflight has stayed at or above {{ .Values.prometheusRule.tasksInflightThreshold }} for 2h with nothing draining: the concurrency-cap-deadlock signature (stuck, not erroring)."
        # ---- Class B: active failures (operator-native counters, reliably scraped) ----
        - alert: TataraReconcileErrors
          expr: rate(operator_reconcile_total{result="error"}[15m]) > 0
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "tatara-operator reconciles are erroring"
            description: "operator_reconcile_total{result=\"error\"} has been increasing for 15m; reconciliation is failing for at least one resource kind."
        - alert: TataraTaskRejections
          expr: increase(operator_task_terminal_total{state="rejected"}[30m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "Tasks are reaching the terminal rejected state"
            description: "{{ "{{" }} $value {{ "}}" }} Task(s) entered state=rejected in the last 30m. The stateReason label carries why (declined, false-positive, tracked-elsewhere, issue-closed, mr-closed-externally, mr-taken-over). #521 removed `failed` as a state: a FAILURE now parks, so TataraTasksParked is where an exhaustion shows up."
        - alert: TataraTasksParked
          expr: increase(operator_task_parked_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "Tasks are parking (the loop gave up and wants a human)"
            description: "{{ "{{" }} $value {{ "}}" }} Task(s) parked in the last 1h: the loop stopped making progress on its own and is waiting on a human or a bounded retry. The parkReason label carries why (admission-starved, stage-deadline, awaiting-human, merge-timeout, pod-recreation-exhausted, ...) and the state label says where it stalled. #521 made park a FLAG orthogonal to state, so operator_task_terminal_total no longer sees a park at all and this counter is the only signal. A sweep-minted park is NOT counted - only a Task that actually ran and then gave up."
        - alert: TataraResidencyExceeded
          expr: increase(operator_task_residency_exceeded_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "agents are hitting the absolute residency bound instead of finishing"
            description: "{{ "{{" }} $value {{ "}}" }} Task(s) were parked by the ABSOLUTE residency backstop in the last 1h. #521 replaced a live state's work clock with an IDLE clock on conversationLastEventAt, which a chatty reviewer resets forever; this counter is how often the backstop had to fire instead. A sustained rate means agents are ping-ponging rather than converging - read the state and kind labels."
        - alert: TataraParkedWithLivePod
          expr: increase(operator_task_parked_with_live_pod_repaired_total[1h]) > 2
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "parked Tasks keep being found still holding a live agent pod"
            description: "{{ "{{" }} $value {{ "}}" }} repair(s) in the last 1h. parkReason != \"\" with a live pod is a TRANSIENT by design - ParkTask stamps the flag and deletes the pod in one call - so a SUSTAINED non-zero rate means the park-then-stop sequence is not completing and admission slots are leaking with no clock armed."
        - alert: TataraTurnTimeouts
          expr: increase(operator_turn_timeout_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "agent turns are timing out"
            description: "operator_turn_timeout_total increased in the last 1h: one or more agent turns stalled past the inactivity deadline."
        - alert: TataraAgentBootCrashLoop
          expr: increase(operator_task_parked_total{parkReason="pod-recreation-exhausted"}[30m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "wrapper agents are failing to boot"
            description: "A Task parked pod-recreation-exhausted in the last 30m: its wrapper Pod exhausted maxPodRecreations without /readyz coming up inside podReadyTimeout. The redesign deleted bootcrash.go and with it the only emitter of operator_agent_boot_crash_total, so this alert selects the reason the machine actually writes (clock 2 -> respawn, budget spent -> park(pod-recreation-exhausted)). #521 moved it from a terminal stage to the park flag."
        - alert: TataraAgentUnreachable
          expr: increase(operator_agent_unreachable_termination_total[15m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "Tasks terminated for an unreachable wrapper"
            description: "operator_agent_unreachable_termination_total increased in 15m: a Task was killed because its wrapper agent stayed unreachable past the boot deadline."
        - alert: TataraIngestJobFailing
          expr: operator_repository_ingest_failing > 0
          # 20m, strictly after the 18m ingestGateMaskDelay: a repo that starts
          # failing at the same moment its project memory stack goes down must not
          # fire at 15m and then resolve at 18m when the mask engages - that
          # pairing is a guaranteed flap. 20m still sits far below the 1h window
          # the routed tatara-observability sibling uses.
          for: 20m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "memory re-ingest is failing for a repo"
            description: "Repository {{ "{{" }} $labels.repo {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}) has been in a failing ingest state (status Phase=Failed or unresolved consecutive ingest failures) for 20m: its recall corpus is going stale. This keys on the live per-repo operator_repository_ingest_failing gauge derived from the Repository status, so it clears the moment a re-ingest succeeds. Unlike the old increase(operator_ingest_job_total[1h]) alert it does NOT keep firing for an hour after a transient incremental burst self-heals via the full-ingest fallback (issue #138). A repo held by the memory-readiness gate is masked to 0 only once the project memory stack has been continuously non-Ready for 18m (ingestGateMaskDelay) - a short memory blip does NOT mask it, so this alert can still fire in the first 18m of an outage. Once the mask engages, a gated repo launches no new ingest Job and could therefore never clear this alert on its own; it fires TataraIngestGated instead (issue #525). Back-off between retries does NOT mask the gauge, and neither does an ingest Job already in flight - only the qualified gate does."
        - alert: TataraIngestGated
          expr: operator_repository_ingest_gated > 0
          for: 1h
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "memory re-ingest is held by the memory-readiness gate"
            description: "Repository {{ "{{" }} $labels.repo {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}) has had its re-ingest held by the project memory-readiness gate for 1h. The gate is a SILENT hold - nothing fails and nothing retries - so a repo that was HEALTHY when the gate closed reads operator_repository_ingest_failing=0 throughout and TataraIngestJobFailing cannot see it; a 37h fleet-wide freeze was previously caught only by TataraIngestStale's 26h backstop (issue #434). This is the per-repo signal while the gate holds. A repo that was already failing when the gate closed keeps operator_repository_ingest_failing at 1 for the first 18m of the outage and only then has it masked, because gated means no new ingest Job runs and nothing could reset the failure state once the mask engages. The two gauges are therefore mutually exclusive only for a SUSTAINED gate (18m+ of continuous non-Ready memory stack), never for a chattering one. The gate normally clears within the 3m memory-Ready stabilization window, so an hour of it means the project's memory stack is not converging - check operator_memory_stacks for that project. A repo whose ingest Job is already running is NOT reported gated, so this never fires for a repo that is mid-ingest."
        - alert: TataraIngestStale
          expr: (time() - operator_repository_last_ingest_timestamp_seconds) > {{ .Values.prometheusRule.ingestStaleAfterSeconds }}
          for: 30m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a repo has not been re-ingested recently"
            description: "Repository {{ "{{" }} $labels.repo {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}) last ingested {{ "{{" }} $value | humanizeDuration {{ "}}" }} ago, past the {{ .Values.prometheusRule.ingestStaleAfterSeconds }}s staleness budget: the recall corpus is going stale even though no ingest Job is actively failing (e.g. the re-ingest cron is not landing). Tune via prometheusRule.ingestStaleAfterSeconds."
        - alert: TataraSCMWriteErrors
          expr: increase(operator_scm_writes_total{kind="write",result="error"}[15m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "SCM write-backs are failing"
            description: "operator_scm_writes_total{kind=\"write\",result=\"error\"} increased in 15m: a comment, PR, label, or board update failed to write back to the SCM. Break down operator_scm_request_errors_by_status_total by (verb, status) to localize which write failed: token (401/403), rate-limit (429), or network. A burst confined to verb=\"remove_label\" status=\"404\" is benign lifecycle-label churn (the label was already absent), swallowed since issue #159 and no longer counted as an error."
        - alert: TataraSCMWriteFailureRatioHigh
          expr: |
            (
                sum(increase(operator_scm_writes_total{kind="write",result="error"}[15m]))
              /
                sum(increase(operator_scm_writes_total{kind="write",result=~"ok|error"}[15m]))
            ) > 0.30
            and
                sum(increase(operator_scm_writes_total{kind="write",result=~"ok|error"}[15m])) >= 3
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "SCM write failure ratio high"
            description: "More than 30% of SCM write-backs (comments/labels/approvals/PRs/board) errored over 15m, with at least 3 writes attempted. Denominator excludes kind=\"read\" traffic and blocked (deliberate hard-gate refusals), so this tracks genuine write failures. Break down operator_scm_request_errors_by_status_total by (verb, status) first to see which write is failing: 401/403 => token in the project ScmSecretRef, 429 => rate limit, network/5xx => egress or provider outage. A burst confined to verb=\"remove_label\" status=\"404\" is benign lifecycle-label churn (the label was already absent), swallowed since issue #159 and no longer counted as an error."
        # ---- Class B2: the task-centric machine's own failure modes ----
        # TataraWritebackGaveUp4xx was DELETED here: operator_writeback_outcome_total
        # lost its last emitter when the redesign deleted writeback.go. The agent now
        # opens its own PR through the REST API (mr_write), so there is no operator-side
        # writeback retry loop left to give up, and a 4xx on that call is answered to the
        # agent synchronously. An alert on a metric nothing emits is green forever.
        - alert: TataraUnexpectedMerge
          expr: increase(operator_unexpected_merge_total[15m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.criticalSeverityLabel | quote }}
          annotations:
            summary: "a PR merged that the operator did not merge"
            description: "operator_unexpected_merge_total{repo=\"{{ "{{" }} $labels.repo {{ "}}" }}\"} increased in 15m: a MergeRequest was observed merged with no mergeCursor advance, i.e. something merged a PR that was NOT the operator's sequential merge. THE MERGE GATE IS OPERATOR LOGIC, NOT A FORGE-ENFORCED CONTROL (accepted risk D-A / contract C.9): one bot identity means the operator cannot post an approving review, so branch protection can never require one, and any pod holding GIT_TOKEN can bypass the gate by curling the merge endpoint. This counter is the DETECTION half of that decision. Treat a non-zero value as an unreviewed change on main until proven otherwise."
        - alert: TataraIllegalStageTransition
          expr: increase(operator_illegal_stage_transition_total[30m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the stage machine refused an illegal transition"
            description: "operator_illegal_stage_transition_total{from=\"{{ "{{" }} $labels.from {{ "}}" }}\",to=\"{{ "{{" }} $labels.to {{ "}}" }}\"} increased in 30m: a caller asked EnterStage for an edge that is not in the F.3 transition table. A non-zero value is a CODE BUG, not an operational condition - the Task is stuck wherever it was."
        - alert: TataraSemverLabelMissing
          expr: increase(operator_semver_label_missing_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a PR merged with no semver label: CI cut no release tag"
            description: "operator_semver_label_missing_total{repo=\"{{ "{{" }} $labels.repo {{ "}}" }}\"} increased in 1h: the operator merged a MergeRequest that carried no declared change significance, so no semver:<level> label was on the PR at the merge commit and the push-CD pipeline cuts NO tag from it (contract H.4). No tag means no publish, no pin, and the deploying stage never resolves. The merge is deliberately NOT stalled on this (that would strand a reviewed, approved change behind an operator bug); a human must tag the merged commit."
        - alert: TataraSweepStalled
          expr: (time() - max by (project, activity) (operator_sweep_last_success_timestamp_seconds)) > {{ .Values.prometheusRule.sweepStaleAfterSeconds }}
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the B.4 sweep has not completed a clean pass"
            description: "No fully successful sweep pass for project {{ "{{" }} $labels.project {{ "}}" }} activity {{ "{{" }} $labels.activity {{ "}}" }} in {{ "{{" }} $value | humanizeDuration {{ "}}" }} (budget {{ .Values.prometheusRule.sweepStaleAfterSeconds }}s). SINCE THE REDESIGN THE SWEEP IS THE ONLY INTAKE - the webhook mints nothing - so a sweep that errors on every pass means the platform silently takes in no work at all while looking healthy. The heartbeat gauge is LIVENESS, not zero-error health (issue #325): it is stamped whenever the repos loop runs to completion, even with per-item errors, so only a pass that cannot even begin leaves it unset; break down operator_sweep_errors_total by (project, activity, reason) for which step failed. Grouped by (project, activity) since issue #441: without `project` in the grouping, one healthy Project's fresh timestamp masked a sibling Project's genuinely dead cron. Tune via prometheusRule.sweepStaleAfterSeconds (must exceed the project's issueScan schedule)."
        - alert: TataraSweepErrors
          expr: increase(operator_sweep_errors_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the B.4 sweep is erroring"
            description: "operator_sweep_errors_total{project=\"{{ "{{" }} $labels.project {{ "}}" }}\",activity=\"{{ "{{" }} $labels.activity {{ "}}" }}\",reason=\"{{ "{{" }} $labels.reason {{ "}}" }}\"} increased in 1h: the only intake path is failing on at least one repo (list_issues, list_prs, owner_repo, mint, ...). Work on the forge is not being picked up."
        - alert: TataraSweepSkipPersistent
          expr: increase(operator_sweep_skipped_total{reason!="mint_budget_bound"}[{{ .Values.prometheusRule.sweepSkipWindow }}]) >= {{ .Values.prometheusRule.sweepSkipPassThreshold }}
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the B.4 sweep keeps skipping the same item"
            description: "operator_sweep_skipped_total{project=\"{{ "{{" }} $labels.project {{ "}}" }}\",activity=\"{{ "{{" }} $labels.activity {{ "}}" }}\",reason=\"{{ "{{" }} $labels.reason {{ "}}" }}\"} increased {{ "{{" }} $value {{ "}}" }} times in {{ .Values.prometheusRule.sweepSkipWindow }}: a single sweep skip is a NORMAL steady state (reason=mr_claimed_by_other_task means a live Task legitimately controller-owns that MergeRequest, including while parked - parked is re-entrant), so this alerts only on one that never clears. That means the owning Task has stopped progressing and is not being reaped: find it with operator_task_state_age_seconds, then resolve or reap it. Issue #477: this replaces the ERROR-line trickle that used to report the same condition as a repeating sweep fault. reason=\"mint_budget_bound\" is EXCLUDED from the expression and the exclusion is load-bearing: it is a CAP DOING ITS JOB, not a failure. An orphan deferred because maxOpenTasks (6 in prod) is full is a NORMAL steady state emitted on every sweep pass for as long as the backlog lasts, so it would fire this alert permanently and bury the mr_claimed_by_other_task signal it exists for. It is deduped to ONE increment per pass, which fixes the series but not the alert: at a 24h window, a threshold of 6 and the 4h issueScan cron, one increment per pass still clears the threshold. The deferral stays on the same series - read it on a dashboard, not through this alert - and a budget that never frees shows up as a Task whose operator_task_state_age_seconds keeps climbing."
        - alert: TataraObjectTooLarge
          expr: increase(operator_object_too_large_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a CR exceeded the byte budget with nothing left to evict"
            description: "operator_object_too_large_total{kind=\"{{ "{{" }} $labels.kind {{ "}}" }}\",name=\"{{ "{{" }} $labels.name {{ "}}" }}\"} increased in 1h: the A.7 pre-write guard refused a write because the object is over budget and every evictable field is already empty. The write was DROPPED - a comment, note or event is lost - and the object cannot grow again until a human prunes it."
        - alert: TataraPushMetricsRejected
          expr: increase(operator_push_receive_total{result="rejected"}[15m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "wrapper metric pushes are being rejected"
            description: "operator_push_receive_total{result=\"rejected\"} increased in 15m: ephemeral wrapper/ingest pod metrics are being lost at the push receiver, a self-observability blind spot."
        - alert: TataraPushMetricsDropped
          expr: increase(operator_push_series_dropped_total{reason="reserved_name"}[15m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "pushed metric families are being dropped for an unallowed name prefix"
            description: "operator_push_series_dropped_total{reason=\"reserved_name\"} increased in 15m: a short-lived pod pushed a metric family whose name matches no prefix in the push allowlist (operator chart value pushMetricsAllowedPrefixes / PUSH_METRICS_ALLOWED_PREFIXES), so it was silently dropped before reaching Prometheus. This is allowlist drift (issue #129): a wrapper or ingester added a metric family whose prefix is not admitted. The receiver logs the dropped family names at WARN (action=\"push_series_dropped\") on each affected push; add their prefix to pushMetricsAllowedPrefixes."
        - alert: TataraReaperDeleteErrors
          expr: increase(operator_reap_delete_error_total[1h]) > 0
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the orphan reaper cannot delete pods"
            description: "operator_reap_delete_error_total increased in 1h: the backstop reaper failed to delete orphan wrapper pods/services, the zombie-pod-leak signal."
        - alert: TataraTokenBudgetBlocked
          expr: increase(operator_admission_blocked_total{reason="token_budget"}[30m]) > 0
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "a project is paused on its token budget"
            description: "operator_admission_blocked_total{reason=\"token_budget\"} has been increasing for 15m (the project and pool class are in the series labels): the token-budget gate is holding proactive work (class=\"normal\") - or, at the emergency threshold, incident work (class=\"alert\") - until the usage window resets (issue #189). Expected when a window is genuinely exhausted; investigate if unexpected (a mis-set tokenBudget percent/limit/schedule, or runaway token spend). Current usage vs the 50%/80% thresholds is on operator_token_budget_used_ratio."
        # TataraTokenBudgetBlocked above cannot detect an INERT gate: it watches a
        # counter that only the gate holding something increments, so a gate
        # evaluating 0% forever is indistinguishable from a healthy idle one. That
        # is exactly how the claudeSubscription gate ran with no data feed at all
        # for weeks. This rule watches the FEED instead of its consequences.
        #
        # tatara_account_usage_gate_ready is emitted by the LEADER only, and only
        # while the gate is enabled in claudeSubscription mode - it is a label-less
        # GaugeVec whose child is created on first Set, so a disabled gate, a
        # customWindow-mode gate and every non-leader replica produce NO SERIES and
        # `== 0` matches nothing. Do not "simplify" it to a plain Gauge or add an
        # `or vector(0)`: either one makes this fire on every operator that never
        # turned the gate on.
        #
        # TRAFFIC-GATED, because an idle fleet is not a dead feed. The snapshot
        # only leaves an agent pod attached to the turn-complete callback, so
        # store freshness is bounded by fleet turn-COMPLETION cadence and a fleet
        # with an empty queue ages its snapshot out and drops gate_ready to 0 BY
        # DESIGN. An idle fleet burning nothing against an ungoverned gate costs
        # nothing; ungated this rule pages every night on designed behaviour, and
        # the reflex to that is to raise `for:` until the compensating control is
        # decoration. Same idiom as TataraTurnSubmitLatencyHigh below.
        #
        # The guard operands are the operator's OWN queue gauges, not
        # kube-state-metrics: they come from the same leader process that
        # publishes gate_ready, so the guard shares fate with the metric it
        # guards and no other exporter's outage can silently disable it.
        #
        # `and`, NOT a product with `== bool 0`: `bool` values the healthy case 0
        # instead of dropping it, and an alerting rule fires on any element the
        # expression returns whatever its value - so the arithmetic spelling
        # pages on a BUSY fleet whose gate is perfectly fine (measured on this
        # cluster: 11 such samples in 14h, in runs of up to 1.5h, well past
        # `for: 30m`). min() rather than max() so a demoted leader's lingering
        # child fails toward alerting.
        - alert: TataraAccountUsageFeedDead
          expr: min(tatara_account_usage_gate_ready) == 0 and (sum(operator_queue_inflight) + sum(operator_queue_depth)) > 0
          for: 30m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "the Claude subscription usage gate is enabled but has no fresh snapshot"
            description: "tatara_account_usage_gate_ready has been 0 for 30m WHILE WORK WAS IN FLIGHT (operator_queue_inflight + operator_queue_depth > 0): tokenBudget is enabled in claudeSubscription mode but no usage snapshot newer than tokenBudgetMaxSnapshotAge is governing admission, so the gate FAILS OPEN and admits everything regardless of how much of the shared Claude subscription is burnt. THIS IS THE ALERT WHOSE ABSENCE LET THE GATE SIT INERT FOR WEEKS - TataraTokenBudgetBlocked watches operator_admission_blocked_total{reason=\"token_budget\"}, a derived counter that by construction never increments while the gate evaluates 0%. Check tatara_account_usage_snapshot_age_seconds for which feed (source=\"wrapper\"|\"poller\") went quiet and how long ago. For the wrapper feed: agent pods report via their statusline (cc-statusline) on the turn-complete callback, so a 0 here with turns still completing means the statusline is not firing in the pods (check ccw_statusline_reports_total on the pushed wrapper metrics) or the operator is not persisting Task status.accountUsage. The series is absent entirely when the gate is disabled, so a disabled gate never fires this."
        # ---- Class C: latency / saturation (the one histogram_quantile alert; traffic-gated so idle windows stay NaN-safe) ----
        # histogram_quantile over an all-zero bucket rate returns NaN; an un-gated quantile rule false-fires on
        # every idle window (issue #143). The "and sum(rate(..._count[15m])) > 0" gate means the quantile only
        # produces a series when turns are actually being submitted, so idle windows yield no series, never a NaN.
        - alert: TataraTurnSubmitLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(operator_turn_submit_duration_seconds_bucket[15m])) by (le)
            ) > {{ .Values.prometheusRule.turnSubmitP95LatencyThreshold }}
            and
            sum(rate(operator_turn_submit_duration_seconds_count[15m])) > 0
          for: 15m
          labels:
            severity: {{ .Values.prometheusRule.severityLabel | quote }}
          annotations:
            summary: "tatara-operator SubmitTurn p95 latency is high"
            description: "SubmitTurn p95 latency is {{ "{{" }} $value {{ "}}" }}s (> {{ .Values.prometheusRule.turnSubmitP95LatencyThreshold }}s) over 15m, evaluated only while turns are actively being submitted (the quantile is gated on sum(rate(operator_turn_submit_duration_seconds_count[15m])) > 0, so idle windows yield no series instead of a NaN that would false-fire, issue #143). Dispatching agent turns is slow: wrappers may be unreachable or saturated. The histogram tops out at 25.6s (ExponentialBuckets(0.05,2,10)), so a true p95 can never exceed that ceiling and this threshold is kept well under it."
{{- end }}

name: release

# Semver push-CD release pipeline (design:
# docs/superpowers/specs/2026-06-28-semver-push-cd-design.md, section 7).
# On push to main: cut the next semver tag from the merged PR's `semver:*`
# label, publish the image (:vX.Y.Z only - ci-shared.yml's image job already
# pushed :SHORT_SHA for this commit, and Harbor's containers project has tag
# immutability, so re-pushing :SHORT_SHA here 412s) and BOTH charts (bare
# X.Y.Z), then propagate the new version into the tatara-helmfile pins via a
# bot PR. The bump is gated on BOTH charts publishing so the partial-publish
# wedge (operator-ci-partial-chart-publish-2026-06-25) cannot ship a half
# release into the helmfile. ci.yml still runs the required PR/push checks
# (lint/test/build) and the SHORT_SHA traceability image in parallel; this
# workflow owns only the semver tag/publish/propagate.

on:
  push:
    branches: [main]

# Serialize operator releases so concurrent merges to main do not race the tag
# cut or clobber each other's cd/deploy-train commit (mirrors apply.yaml).
concurrency:
  group: cd-release-tatara-operator
  cancel-in-progress: false

env:
  BUILDKIT_VERSION: '0.18.2'

jobs:
  tag:
    runs-on: tatara-operator
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cut next semver tag from merged PR label
        id: cut
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: tag
          token: ${{ secrets.TATARA_CD_TOKEN }}

  publish:
    needs: [tag]
    runs-on: tatara-operator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: install buildctl
        run: |
          curl -sSfL "https://github.com/moby/buildkit/releases/download/v${BUILDKIT_VERSION}/buildkit-v${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local bin/buildctl
      - name: build and push image at semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # Build at the computed semver and push ONLY the :vX.Y.Z tag (what
          # the helmfile pin moves to). ci-shared.yml's image job already
          # pushed :SHORT_SHA for this commit, and Harbor's containers project
          # has tag immutability, so re-pushing :SHORT_SHA here 412s. Same
          # rootless buildkitd / harbor-auth pattern as ci-shared.yml's image
          # job.
          set -euo pipefail
          BUILDKITD_ADDR="tcp://buildkitd.arc-runners:1234"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEST="harbor.szymonrichert.pl/containers/${REPO}"

          : "${VERSION:?cd-release tag did not emit a version}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN required}"
          : "${HARBOR_USERNAME:?HARBOR_USERNAME required}"
          : "${HARBOR_PASSWORD:?HARBOR_PASSWORD required}"

          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          auth="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
          cat >"${DOCKER_CONFIG}/config.json" <<EOF
          {"auths":{"harbor.szymonrichert.pl":{"auth":"${auth}"}}}
          EOF

          buildctl --addr "$BUILDKITD_ADDR" build \
            --frontend dockerfile.v0 \
            --opt context="https://github.com/szymonrychu/${REPO}.git#${GITHUB_SHA}" \
            --opt filename=Dockerfile \
            --opt build-arg:VERSION="${VERSION}" \
            --opt build-arg:COMMIT="${SHORT_SHA}" \
            --opt build-arg:DATE="${BUILD_DATE}" \
            --secret id=GIT_AUTH_TOKEN,env=GITHUB_TOKEN \
            --output "type=image,\"name=${DEST}:${VERSION}\",push=true"

          echo "buildkit: pushed ${DEST}:${VERSION}"
      - name: package and push BOTH charts at semver
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # Charts publish at the bare semver X.Y.Z (drops the legacy 0.0.0-g
          # scheme). app-version carries the v-prefixed image version. After
          # pushing, pull both back to PROVE the partial-publish wedge did not
          # leave one chart missing before the bump step can run.
          set -euo pipefail
          : "${VERSION:?missing version}"
          CHART_VERSION="${VERSION#v}"
          helm registry login harbor.szymonrichert.pl -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          for dir in charts/*/; do
            NAME="$(basename "$dir")"
            helm package "$dir" --version "${CHART_VERSION}" --app-version "${VERSION}"
            helm push "${NAME}-${CHART_VERSION}.tgz" oci://harbor.szymonrichert.pl/charts
          done
          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT
          for NAME in tatara-operator tatara-project; do
            helm pull "oci://harbor.szymonrichert.pl/charts/${NAME}" \
              --version "${CHART_VERSION}" -d "$verify"
          done
          echo "charts: published and verified tatara-operator + tatara-project @ ${CHART_VERSION}"

  bump:
    needs: [tag, publish]
    runs-on: tatara-operator
    outputs:
      version: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: propagate version into tatara-helmfile pins
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-helmfile
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          # All 5 pins rewritten atomically in ONE deploy-train commit. The 4
          # chart-version pins (the tatara-operator release plus all three
          # tatara-project releases project-tatara/project-infrastructure/
          # project-mtg) take the bare X.Y.Z; the image tag takes vX.Y.Z.
          # Match by release NAME, never a global replace, or tatara-chat's
          # pin is clobbered.
          pins: |
            [
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: tatara-operator\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-tatara\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-infrastructure\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-mtg\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"values/tatara-operator/common.yaml","pattern":"^(\\s*tag: )\".*\"$","value_template":"\\1\"{{image_version}}\""}
            ]

  # THE FAN-OUT IS ONLY DONE WHEN THE PIN IS ON tatara-helmfile's main.
  #
  # Issue #512: on 2026-07-29 this cascade stopped producing anything after
  # 12:24:53Z. Tags v1.39.5 and v1.39.6 were cut and published; no `cd: bump`
  # commit and no bump PR ever appeared for either. `bump` reporting success is
  # NOT evidence that a pin landed - the failure mode was the WRITER producing
  # nothing at all - so this job reads the pin back from the forge and fails if
  # it never arrives. Prod stayed frozen at v1.39.4 for ~9h and the first anyone
  # heard of it was a Task burning its 2h deploy budget and discarding merged
  # PR #509 at deploy-blocked.
  verify-pin:
    needs: [tag, bump]
    runs-on: tatara-operator
    outputs:
      state: ${{ steps.verify.outputs.state }}
      detail: ${{ steps.verify.outputs.detail }}
    steps:
      - name: read the pin back from tatara-helmfile main
        id: verify
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          : "${VERSION:?cd-release tag did not emit a version}"
          : "${TOKEN:?TATARA_CD_TOKEN required}"
          BARE="${VERSION#v}"
          PARENT="szymonrychu/tatara-helmfile"
          BRANCH="cd/deploy-train"
          # Test knobs (hack/test-cd-release-jobs.sh); CI takes the defaults.
          ATTEMPTS="${VERIFY_POLL_ATTEMPTS:-10}"
          NAP="${VERIFY_POLL_SLEEP:-30}"

          # curl's own --retry covers exactly the transient set that broke this
          # cascade (408/429/500/502/503/504). Attempt 8 of run 32035597231 died
          # on a bare `curl: (22) 503` and took the alarm down with it.
          api() {
            curl -sSf --retry 5 --retry-delay 3 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: ${2:-application/vnd.github+json}" \
              "https://api.github.com/$1"
          }
          raw() { api "$1" application/vnd.github.raw; }

          verdict() { # <state> <detail>
            echo "state=$1" >> "$GITHUB_OUTPUT"
            echo "detail=$2" >> "$GITHUB_OUTPUT"
          }

          # Anchored and dot-escaped: `.` is regex-any and the match used to be
          # unanchored, so `version: 3.4.0` was satisfied by `13.4.0` or
          # `3.4.0-rc1`. And it demands ALL FOUR pins the bump job rewrites in
          # one commit (tatara-operator plus the three tatara-project releases);
          # matching "somewhere in the file" let a partially-applied fan-out -
          # one of the four apply-pins regexes having drifted - read as landed.
          BARE_RE="${BARE//./\\.}"
          VER_RE="${VERSION//./\\.}"
          OPERATOR_PINS=4

          # 0 pinned, 1 not pinned, 2 could not read. "Could not read" is NOT
          # "not pinned": conflating the two is what produced a false alarm.
          pinned_on() { # <ref>
            local hf vals n
            hf="$(raw "repos/${PARENT}/contents/helmfile.yaml.gotmpl?ref=$1")" || return 2
            vals="$(raw "repos/${PARENT}/contents/values/tatara-operator/common.yaml?ref=$1")" || return 2
            n="$(printf '%s' "$hf" | grep -cE "^[[:space:]]*version: ${BARE_RE}[[:space:]]*$" || true)"
            [ "$n" -ge "$OPERATOR_PINS" ] || return 1
            printf '%s' "$vals" | grep -qE "^[[:space:]]*tag: \"${VER_RE}\"[[:space:]]*$" || return 1
          }

          # 1. Fast path. A healthy cascade lands in minutes, so poll briefly
          # and cheaply before spending a state query on it.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            rc=0; pinned_on main || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "cd: ${VERSION} is pinned on ${PARENT} main (attempt ${attempt})"
              verdict pinned "${VERSION} is pinned on ${PARENT} main."
              exit 0
            fi
            echo "cd: ${VERSION} not on ${PARENT} main yet (attempt ${attempt}/${ATTEMPTS}, read rc=${rc})"
            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$NAP"; fi
          done

          # 2. Not on main yet. ONE state query decides between "the cascade is
          # broken" and "the cascade is slow" - which the old 10m timeout could
          # not tell apart. On 2026-08-17 PR #423 was open and armed the whole
          # time and merged 28.8m after the bump, ~5m after this job gave up,
          # and the alarm still said the bump produced nothing (#622).
          #
          # The bound stays short on purpose. `concurrency: cd-release-tatara-
          # operator` with cancel-in-progress: false keeps only ONE pending run
          # per group, so waiting out a ~40m merge here means a third merge to
          # main evicts the queued run: a release that never gets tagged.
          if ! pr="$(api "repos/${PARENT}/pulls?state=open&head=${PARENT%%/*}:${BRANCH}")"; then
            echo "::error::CD pin fan-out: ${VERSION} is not on ${PARENT} main and ${BRANCH} could not be read from the forge."
            verdict forge-unreadable "${VERSION} is not on ${PARENT} main and the forge could not be queried for ${BRANCH}."
            exit 1
          fi
          # One GUARDED read, not four bare ones. `.[0]` on a JSON OBJECT is a jq
          # hard error, and every GitHub error body is an object - so `{"message":
          # "Bad credentials"}` used to exit the step here writing NO verdict, and
          # the alarm then said "the bump job failed first" under a bullet reading
          # "bump job: success". The `ok` sentinel is what distinguishes an EMPTY
          # body from a genuinely empty list: jq on empty stdin prints nothing and
          # exits 0, so `.[0].number // empty` cannot tell them apart, and
          # believing the second reading files no-pr - the loudest verdict here,
          # whose remedy sends a human to hand-apply five pins.
          if ! fields="$(printf '%s' "$pr" | jq -r '
                if type != "array" then error("not a pull request list") else . end
                | "ok", (.[0].number // ""), (.[0].html_url // ""),
                  (.[0].head.sha // ""),
                  (if (.[0].auto_merge // null) == null then "" else "yes" end)')" \
             || [ -z "$fields" ]; then
            echo "::error::CD pin fan-out: ${VERSION} is not on ${PARENT} main and the ${BRANCH} response did not parse."
            verdict forge-unreadable "${VERSION} is not on ${PARENT} main and the forge's ${BRANCH} response could not be read."
            exit 1
          fi
          num="$(printf '%s' "$fields" | sed -n 2p)"
          url="$(printf '%s' "$fields" | sed -n 3p)"
          head_sha="$(printf '%s' "$fields" | sed -n 4p)"
          armed="$(printf '%s' "$fields" | sed -n 5p)"

          if [ -z "$num" ]; then
            echo "::error::CD pin fan-out is DOWN: ${VERSION} is not on ${PARENT} main and no open ${BRANCH} PR exists."
            echo "::error::The bump job pushed no pin at all, or pushed one and never opened a PR for it."
            verdict no-pr "No open ${BRANCH} PR exists on ${PARENT}, and ${VERSION} is not on its main."
            exit 1
          fi

          rc=0; pinned_on "$BRANCH" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::CD pin fan-out: ${PARENT}#${num} is open but its contents could not be read."
            verdict forge-unreadable "${PARENT}#${num} (${url}) is open but its contents could not be read from the forge."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} is open but does not carry ${VERSION}: ${url}"
            verdict pin-missing "${PARENT}#${num} (${url}) is open but does not carry ${VERSION}."
            exit 1
          fi

          if [ -z "$armed" ]; then
            echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} carries ${VERSION} but auto-merge is NOT armed; it will never merge on its own: ${url}"
            verdict not-armed "${PARENT}#${num} (${url}) carries ${VERSION} but auto-merge is not armed."
            exit 1
          fi

          red=""
          pending=1
          if [ -n "$head_sha" ]; then
            # Guarded like every other read here, and for the same reason: a
            # bare assignment under `set -e` dies WITHOUT writing a verdict, and
            # the alarm then reports "the bump job failed first" on a healthy,
            # armed, correct PR. curl does not retry a 403 secondary rate limit,
            # so this is reachable.
            # per_page=100: check-runs pages at 30 by default, and a red run on
            # page 2 would read as "green, in flight" - the exact false-negative
            # this verdict exists to remove.
            if ! checks="$(api "repos/${PARENT}/commits/${head_sha}/check-runs?per_page=100")"; then
              echo "::error::CD pin fan-out: ${PARENT}#${num} carries ${VERSION} and is armed, but its check runs could not be read: ${url}"
              verdict forge-unreadable "${PARENT}#${num} (${url}) carries ${VERSION} and is armed, but its check runs could not be read."
              exit 1
            fi
            # `|| :` on the jq, not a bare assignment: a 200 carrying a proxy
            # error page instead of JSON exits the step under `set -e` writing
            # NO verdict, and the alarm then reports "the bump job failed
            # first" about a healthy PR. Unparseable is unreadable, which is
            # already a verdict below - it is not "nothing is red".
            # No `.check_runs[]?`: the `?` swallows "this is not a check-runs
            # response" into "nothing is red", which is the conflation the whole
            # job exists to remove. One compact object rather than two lines,
            # because a check NAME may contain a newline and a line-indexed read
            # would then take the count off the wrong line - a VALID number,
            # silently wrong, asserting "every check has reported" while one is
            # still running. Names are flattened for the same reason:
            # $GITHUB_OUTPUT is line-oriented and a newline in a verdict corrupts
            # every key after it.
            if ! summary="$(printf '%s' "$checks" | jq -c '
                  if (.check_runs | type) != "array" then error("no check_runs") else . end
                  | {red: ([.check_runs[]
                           | select(.conclusion == "failure" or .conclusion == "timed_out"
                                    or .conclusion == "cancelled" or .conclusion == "action_required")
                           | .name] | join(", ") | gsub("[\r\n]+"; " ")),
                     pending: ([.check_runs[] | select(.status != "completed")] | length)}')" \
               || [ -z "$summary" ]; then
              echo "::error::CD pin fan-out: ${PARENT}#${num} carries ${VERSION} and is armed, but its check runs did not parse: ${url}"
              verdict forge-unreadable "${PARENT}#${num} (${url}) carries ${VERSION} and is armed, but its check runs could not be read."
              exit 1
            fi
            red="$(printf '%s' "$summary" | jq -r .red)"
            pending="$(printf '%s' "$summary" | jq -r .pending)"
          fi
          if [ -n "$red" ]; then
            # A red check is terminal only if it is a REQUIRED context: auto-merge
            # fires over a red non-required one. GitGuardian is not required on
            # tatara-helmfile main and goes red on any PR whose commit RANGE ever
            # carried a secret-shaped literal - an incident anchors to a commit,
            # not to the tree, so no HEAD-side change clears it. Calling that
            # "will not land without a human" is #622's lie with a new trigger.
            #
            # mergeable_state, not branch protection: reading the required
            # contexts needs admin, and this is the field the merge is actually
            # decided by. It only appears on the single-PR GET, hence the second
            # call. `blocked` while a check is still RUNNING only means a
            # required context has not answered yet, so both conditions hold or
            # nothing is decided. Legacy commit statuses are not visible here;
            # every check on these repos is an Actions check run.
            if ! detail="$(api "repos/${PARENT}/pulls/${num}")"; then
              echo "::error::CD pin fan-out: ${PARENT}#${num} carries ${VERSION} and is armed, but its merge state could not be read: ${url}"
              verdict forge-unreadable "${PARENT}#${num} (${url}) carries ${VERSION} and is armed, but its merge state could not be read."
              exit 1
            fi
            # Unparseable is "unknown", which is already a non-blocking answer
            # below - the same reason as the check-runs guard, opposite default:
            # here the honest reading of "I could not tell" is not "stuck".
            mstate="$(printf '%s' "$detail" | jq -r '.mergeable_state // "unknown"')" || mstate=unknown
            if [ "$mstate" = blocked ] && [ "$pending" -eq 0 ]; then
              echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} carries ${VERSION} and is armed, but these checks are red: ${red} (${url})"
              echo "::error::Every check has reported and the forge still calls the merge blocked, so this pin will not land without a human."
              verdict checks-red "${PARENT}#${num} (${url}) carries ${VERSION} and is armed, but these required checks are red: ${red}."
              exit 1
            fi
            echo "::warning::${PARENT}#${num} has red checks that are not blocking its merge (mergeable_state=${mstate}, ${pending} still running): ${red} (${url})"
          fi

          # Open, correct, armed and nothing blocking the merge: in flight, not
          # stalled. The operator owns the rest of the wait - deploy_stage.go
          # bounds it at deployPinFanoutDeadline (45m) and parks at
          # parkReason=deploy-timeout, which is already a critical alert.
          # Failing here would only be a second, louder, wrong alarm.
          # Deliberately not "has no red check": a non-blocking red one may have
          # been reported above, and this detail is pasted into the alarm issue.
          echo "::notice::${PARENT}#${num} carries ${VERSION}, is armed and has nothing blocking its merge: ${url}"
          echo "::notice::Leaving the remaining wait to the operator's 45m deployPinFanoutDeadline."
          verdict in-flight "${PARENT}#${num} (${url}) carries ${VERSION}, is armed and had nothing blocking its merge; it was still in flight when this job ran."
          exit 0

  # LOUD ON FAILURE. A red workflow run nobody looks at is what let #512 sit for
  # ~9h, so the alarm is filed where the platform already reads: an issue on this
  # repo, which the incident pipeline picks up. Deduped by title so a repeated
  # failure comments rather than opening a new tracker each release.
  fanout-alarm:
    needs: [tag, publish, bump, verify-pin]
    if: >-
      always() && needs.tag.result == 'success' &&
      (needs.bump.result != 'success' || needs.verify-pin.result != 'success')
    runs-on: tatara-operator
    steps:
      - name: file the stalled CD pin fan-out
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMP_RESULT: ${{ needs.bump.result }}
          VERIFY_RESULT: ${{ needs.verify-pin.result }}
          VERIFY_STATE: ${{ needs.verify-pin.outputs.state }}
          VERIFY_DETAIL: ${{ needs.verify-pin.outputs.detail }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          : "${TOKEN:?TATARA_CD_TOKEN required}"
          TITLE="CD pin fan-out stalled: ${VERSION} is not pinned in tatara-helmfile"

          # Same retry as verify-pin. Attempt 8 of run 32035597231 lost its
          # alarm to a bare `curl: (22) 503` - the one job whose whole purpose
          # is to be heard was the one that went silent.
          api() {
            curl -sSf --retry 5 --retry-delay 3 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }
          post() { # <path>; JSON body on stdin
            curl -sSf --retry 5 --retry-delay 3 -X POST \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d @- "https://api.github.com/$1"
          }

          # The remedy depends on what verify-pin actually SAW. The old text was
          # unconditional ("the bump action produced nothing") and was wrong on
          # 2026-08-17: PR #423 existed, was armed, and merged. It also named a
          # `cd: bump <component> to <version>` PR, which the terminal hop never
          # opens - it coalesces every component into one `cd: deploy-train` PR -
          # so it sent a human hunting for something that cannot exist.
          case "${VERIFY_STATE:-}" in
            no-pr)
              FIX="No open \`cd/deploy-train\` PR exists on tatara-helmfile."
              FIX="${FIX} Apply the pin by hand (the chart versions in \`helmfile.yaml.gotmpl\`"
              FIX="${FIX} plus the image tag in \`values/tatara-operator/common.yaml\`), open that"
              FIX="${FIX} PR against main and merge it, then find why the \`cd-release\` bump"
              FIX="${FIX} action opened none."
              ;;
            pin-missing | not-armed | checks-red)
              FIX="The \`cd/deploy-train\` PR named above exists; drive it to merge, then"
              FIX="${FIX} fix what stopped it. The terminal hop coalesces every component into"
              FIX="${FIX} that ONE PR, so there is no per-component \`cd: bump\` PR to look for."
              ;;
            forge-unreadable)
              FIX="The forge could not be read, so the fan-out state is UNKNOWN and may"
              FIX="${FIX} well be healthy. Check \`cd/deploy-train\` on tatara-helmfile before"
              FIX="${FIX} assuming anything is broken."
              ;;
            *)
              # This arm also fires when verify-pin died mid-step, was cancelled,
              # or lost its runner - so it must not assert a cause it can see is
              # false. It used to say "the bump job failed first" three lines
              # under a bullet reading "bump job: success".
              if [ "${BUMP_RESULT:-}" = success ]; then
                FIX="\`bump\` succeeded but \`verify-pin\` reached no verdict, so the fan-out"
                FIX="${FIX} state is UNKNOWN and may well be healthy. Read the \`verify-pin\` job's"
                FIX="${FIX} log in the run above, then check \`cd/deploy-train\` on tatara-helmfile."
              else
                FIX="\`bump\` did not succeed, so \`verify-pin\` never ran and no fan-out state"
                FIX="${FIX} was observed. Read the \`bump\` job's log in the run above, then check"
                FIX="${FIX} \`cd/deploy-train\` on tatara-helmfile."
              fi
              ;;
          esac

          BODY=$(printf '%s\n' \
            "The release train cut and published \`${VERSION}\`, but the pin was not on tatara-helmfile's main when this run checked." \
            "" \
            "- bump job: \`${BUMP_RESULT}\`" \
            "- pin verification: \`${VERIFY_RESULT}\`" \
            "- observed fan-out state: \`${VERIFY_STATE:-not observed}\`" \
            "- ${VERIFY_DETAIL:-No fan-out state was observed.}" \
            "- run: ${RUN_URL}" \
            "" \
            "**Nothing can deploy while this is broken.** Every task that reaches" \
            "\`stage=deploying\` polls a pin that will never materialise. The operator now" \
            "bounds that wait and parks at \`deploy-timeout\` (issue #512), so merged work is" \
            "retryable rather than discarded - but it does not ship until this is repaired." \
            "" \
            "Fix: ${FIX}")

          # Plain /issues, not /search/issues: search is rate-limited separately
          # and far more tightly, and it was 503ing throughout the 2026-08-17
          # outage. /issues returns PULL REQUESTS too, hence the filter - a
          # bot-authored PR whose title happens to match is not the tracker.
          # Paged: /issues counts PULL REQUESTS toward per_page BEFORE the
          # filter below, so a single 100-item page is not enough to find the
          # tracker once this repo has a normal number of open PRs - and a miss
          # opens a DUPLICATE tracker every failed release. /search/issues had
          # no such cap; this is the cost of dropping it, and it is bounded.
          # EVERY read in this loop is best-effort, and that is the point. The
          # dedupe decides comment-vs-new-issue; being heard at all is the job.
          # These were bare under `set -e`, so a 403 secondary rate limit (which
          # curl --retry does not cover, and which a page loop invites) or a
          # garbled body took the whole alarm down - the same silence attempt 8
          # of run 32035597231 died of, in the one job whose purpose is to be
          # heard. A duplicate tracker beats no tracker.
          existing=""
          page=1
          while [ "$page" -le 5 ]; do
            batch="$(api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&page=${page}")" || batch=""
            [ -n "$batch" ] || break
            existing="$(printf '%s' "$batch" | jq -r --arg t "CD pin fan-out stalled" \
              '[.[]? | select(has("pull_request") | not) | select(.title | startswith($t))][0].number // empty')" || existing=""
            if [ -n "$existing" ]; then break; fi
            n="$(printf '%s' "$batch" | jq 'length')" || n=0
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            [ "$n" -ge 100 ] || break
            page=$((page + 1))
          done
          if [ -n "$existing" ]; then
            jq -n --arg b "$BODY" '{body:$b}' \
              | post "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" >/dev/null
            echo "commented on existing fan-out tracker #${existing}"
          else
            jq -n --arg t "$TITLE" --arg b "$BODY" '{title:$t, body:$b}' \
              | post "repos/${GITHUB_REPOSITORY}/issues" >/dev/null
            echo "opened a fan-out tracker"
          fi

  # THE CI PIN FAN-OUT (#640). Everything above propagates the operator's
  # IMAGE and CHART versions into tatara-helmfile. This job propagates a
  # different pin entirely: the `uses: .../ci-shared.yml@<ref>` line in each
  # consumer's own ci.yml, which decides which revision of the shared job graph
  # that repo's CI executes.
  #
  # Nothing wrote that pin until this job existed. The four consumers sat on
  # v1.36.1 (2026-07-29) while the `image-verify` merge gate built for #556
  # landed on main and was released - so the gate #556 is about had never once
  # run in any of the four repos #556 measured, and `internal/cicontract`
  # structurally could not see it: it asserts on THIS repo's working tree.
  #
  # `needs: [tag]` and NOT [publish]: the consumers resolve a workflow FILE at
  # that tag, so the pin is deliverable the moment the tag exists. Coupling it
  # to the image publish would strand a CI fix behind an unrelated Harbor
  # failure.
  #
  # GATED ON `plan`, which is what stops this opening four PRs on every release.
  # `plan` compares each consumer's pinned ci-shared.yml against this release's
  # copy BY CONTENT, so only a release that actually changed the shared workflow
  # fans out - and a consumer sitting on an older tag with identical content is
  # correctly left alone. A consumer `plan` cannot READ fails the job rather
  # than being skipped: a fan-out that silently drops a repo is #640.
  #
  # Each bump PR runs that repo's full CI, INCLUDING `image-verify`, against its
  # own ARC scale set. That is the only evidence that matters (doc.go: a test
  # whose green light survives a red gate is worse than no test), and it now
  # arrives on every ci-shared change rather than once.
  #
  # tatara-chat is NOT here: it is decommissioned (installed: false in
  # tatara-helmfile) and is exempt by design, not by omission. See
  # internal/cicontract/fleetpins.go.
  #
  # TWO ACCEPTED COSTS, both real, both deliberately not solved here:
  #
  # 1. NO READ-BACK. `bump` exits 0 when the PR is OPEN, not when the pin
  #    LANDS - the lesson `verify-pin` and `fanout-alarm` above were built from
  #    (#512). This job has no equivalent, so a bump PR stranded on a red
  #    consumer CI leaves this release green. That is not an oversight: a
  #    stranded PR here is EXPECTED, because the ci-shared change this fan-out
  #    delivers is what that CI is about to run, and a red image-verify on the
  #    bump PR is the gate working (#640 premortem 1). Blocking the operator's
  #    release on four sibling repos' CI would make a red gate a reason to
  #    revert the pin. `ci-shared-currency` is the read-back instead, at up to
  #    24h latency, and it names the bump PRs in its issue body.
  # 2. cd-release names the branch `cd/bump-<component>-<version>`, so unlike
  #    the terminal `cd/deploy-train` path the `bump` job above uses, successive
  #    releases do NOT coalesce: a consumer whose PR sits unmerged collects a
  #    second PR rewriting the same line on the next ci-shared change, and
  #    whichever merges first conflicts the other. The currency check still
  #    reads that consumer as stale until a pin actually lands, so the state is
  #    visible rather than silent - which is the property #640 was missing.
  fanout-ci-shared:
    needs: [tag]
    runs-on: tatara-operator
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: plan which consumers this release makes stale
        id: plan
        run: mise exec -- go run ./cmd/ci-shared-pins plan .github/workflows/ci-shared.yml

      # Four explicit steps rather than a matrix over a computed output key: a
      # dynamic `steps.plan.outputs[format(...)]` lookup that evaluates to the
      # empty string skips the bump SILENTLY, and a silently dead fan-out is the
      # exact defect this job closes. The pin pattern is repeated, but
      # apply-pins.py hard-errors on a pattern that matches nothing, so a drift
      # in one copy reds the release instead of shipping a stale pin.
      #
      # Every gate is `!cancelled() && steps.plan.outcome == 'success' && <key>`,
      # and the UNIFORMITY is load-bearing: the two halves close opposite
      # failures, and dropping either from one step breaks that step alone.
      #
      # `!cancelled() &&` so one consumer's bump failure does not strand the
      # other three behind it. The job still goes red.
      #
      # `steps.plan.outcome == 'success' &&` because carrying any status-check
      # function DROPS the implicit `success() &&` Actions would otherwise
      # insert - and `plan` writes $GITHUB_OUTPUT before it returns 1 on an
      # unreadable consumer. Without it, the exact failure this fail-closed
      # design exists for fans the readable consumers out off a plan the code
      # just refused to vouch for, while a step that happens to lack a status
      # function is skipped instead. Asymmetric, and both halves wrong.
      #
      # internal/cicontract/fanout_contract_test.go asserts both halves on every
      # step, and asserts one step per LiveConsumers entry.
      - name: bump tatara-cli's ci-shared pin
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.bump-tatara-cli == 'true' }}
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-cli
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          pins: |
            [
              {"file":".github/workflows/ci.yml","pattern":"^(\\s*uses: szymonrychu/tatara-operator/\\.github/workflows/ci-shared\\.yml@).*$","value_template":"\\1{{version}}"}
            ]

      - name: bump tatara-memory's ci-shared pin
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.bump-tatara-memory == 'true' }}
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-memory
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          pins: |
            [
              {"file":".github/workflows/ci.yml","pattern":"^(\\s*uses: szymonrychu/tatara-operator/\\.github/workflows/ci-shared\\.yml@).*$","value_template":"\\1{{version}}"}
            ]

      - name: bump tatara-memory-repo-ingester's ci-shared pin
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.bump-tatara-memory-repo-ingester == 'true' }}
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-memory-repo-ingester
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          pins: |
            [
              {"file":".github/workflows/ci.yml","pattern":"^(\\s*uses: szymonrychu/tatara-operator/\\.github/workflows/ci-shared\\.yml@).*$","value_template":"\\1{{version}}"}
            ]

      - name: bump tatara-claude-code-wrapper's ci-shared pin
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.bump-tatara-claude-code-wrapper == 'true' }}
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-claude-code-wrapper
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          pins: |
            [
              {"file":".github/workflows/ci.yml","pattern":"^(\\s*uses: szymonrychu/tatara-operator/\\.github/workflows/ci-shared\\.yml@).*$","value_template":"\\1{{version}}"}
            ]

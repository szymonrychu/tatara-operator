name: release

# Semver push-CD release pipeline (design:
# docs/superpowers/specs/2026-06-28-semver-push-cd-design.md, section 7).
# On push to main: cut the next semver tag from the merged PR's `semver:*`
# label, publish the image (:vX.Y.Z only - ci-shared.yml's image job already
# pushed :SHORT_SHA for this commit, and Harbor's containers project has tag
# immutability, so re-pushing :SHORT_SHA here 412s) and BOTH charts (bare
# X.Y.Z), then propagate the new version into the tatara-helmfile pins via a
# bot PR. The bump is gated on BOTH charts publishing so the partial-publish
# wedge (operator-ci-partial-chart-publish-2026-06-25) cannot ship a half
# release into the helmfile. ci.yml still runs the required PR/push checks
# (lint/test/build) and the SHORT_SHA traceability image in parallel; this
# workflow owns only the semver tag/publish/propagate.

on:
  push:
    branches: [main]

# Serialize operator releases so concurrent merges to main do not race the tag
# cut or clobber each other's cd/deploy-train commit (mirrors apply.yaml).
concurrency:
  group: cd-release-tatara-operator
  cancel-in-progress: false

env:
  BUILDKIT_VERSION: '0.18.2'

jobs:
  tag:
    runs-on: tatara-operator
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cut next semver tag from merged PR label
        id: cut
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: tag
          token: ${{ secrets.TATARA_CD_TOKEN }}

  publish:
    needs: [tag]
    runs-on: tatara-operator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: install buildctl
        run: |
          curl -sSfL "https://github.com/moby/buildkit/releases/download/v${BUILDKIT_VERSION}/buildkit-v${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local bin/buildctl
      - name: build and push image at semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # Build at the computed semver and push ONLY the :vX.Y.Z tag (what
          # the helmfile pin moves to). ci-shared.yml's image job already
          # pushed :SHORT_SHA for this commit, and Harbor's containers project
          # has tag immutability, so re-pushing :SHORT_SHA here 412s. Same
          # rootless buildkitd / harbor-auth pattern as ci-shared.yml's image
          # job.
          set -euo pipefail
          BUILDKITD_ADDR="tcp://buildkitd.arc-runners:1234"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEST="harbor.szymonrichert.pl/containers/${REPO}"

          : "${VERSION:?cd-release tag did not emit a version}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN required}"
          : "${HARBOR_USERNAME:?HARBOR_USERNAME required}"
          : "${HARBOR_PASSWORD:?HARBOR_PASSWORD required}"

          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          auth="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
          cat >"${DOCKER_CONFIG}/config.json" <<EOF
          {"auths":{"harbor.szymonrichert.pl":{"auth":"${auth}"}}}
          EOF

          buildctl --addr "$BUILDKITD_ADDR" build \
            --frontend dockerfile.v0 \
            --opt context="https://github.com/szymonrychu/${REPO}.git#${GITHUB_SHA}" \
            --opt filename=Dockerfile \
            --opt build-arg:VERSION="${VERSION}" \
            --opt build-arg:COMMIT="${SHORT_SHA}" \
            --opt build-arg:DATE="${BUILD_DATE}" \
            --secret id=GIT_AUTH_TOKEN,env=GITHUB_TOKEN \
            --output "type=image,\"name=${DEST}:${VERSION}\",push=true"

          echo "buildkit: pushed ${DEST}:${VERSION}"
      - name: package and push BOTH charts at semver
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # Charts publish at the bare semver X.Y.Z (drops the legacy 0.0.0-g
          # scheme). app-version carries the v-prefixed image version. After
          # pushing, pull both back to PROVE the partial-publish wedge did not
          # leave one chart missing before the bump step can run.
          set -euo pipefail
          : "${VERSION:?missing version}"
          CHART_VERSION="${VERSION#v}"
          helm registry login harbor.szymonrichert.pl -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          for dir in charts/*/; do
            NAME="$(basename "$dir")"
            helm package "$dir" --version "${CHART_VERSION}" --app-version "${VERSION}"
            helm push "${NAME}-${CHART_VERSION}.tgz" oci://harbor.szymonrichert.pl/charts
          done
          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT
          for NAME in tatara-operator tatara-project; do
            helm pull "oci://harbor.szymonrichert.pl/charts/${NAME}" \
              --version "${CHART_VERSION}" -d "$verify"
          done
          echo "charts: published and verified tatara-operator + tatara-project @ ${CHART_VERSION}"

  bump:
    needs: [tag, publish]
    runs-on: tatara-operator
    outputs:
      version: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: propagate version into tatara-helmfile pins
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-helmfile
          new_value: ${{ needs.tag.outputs.version }}
          pr_label: semver:patch
          # All 5 pins rewritten atomically in ONE deploy-train commit. The 4
          # chart-version pins (the tatara-operator release plus all three
          # tatara-project releases project-tatara/project-infrastructure/
          # project-mtg) take the bare X.Y.Z; the image tag takes vX.Y.Z.
          # Match by release NAME, never a global replace, or tatara-chat's
          # pin is clobbered.
          pins: |
            [
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: tatara-operator\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-tatara\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-infrastructure\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"helmfile.yaml.gotmpl","pattern":"(- name: project-mtg\\n(?:.*\\n)*?\\s*version: )\\S+","value_template":"\\1{{chart_version_bare}}"},
              {"file":"values/tatara-operator/common.yaml","pattern":"^(\\s*tag: )\".*\"$","value_template":"\\1\"{{image_version}}\""}
            ]

  # THE FAN-OUT IS ONLY DONE WHEN THE PIN IS ON tatara-helmfile's main.
  #
  # Issue #512: on 2026-07-29 this cascade stopped producing anything after
  # 12:24:53Z. Tags v1.39.5 and v1.39.6 were cut and published; no `cd: bump`
  # commit and no bump PR ever appeared for either. `bump` reporting success is
  # NOT evidence that a pin landed - the failure mode was the WRITER producing
  # nothing at all - so this job reads the pin back from the forge and fails if
  # it never arrives. Prod stayed frozen at v1.39.4 for ~9h and the first anyone
  # heard of it was a Task burning its 2h deploy budget and discarding merged
  # PR #509 at deploy-blocked.
  verify-pin:
    needs: [tag, bump]
    runs-on: tatara-operator
    outputs:
      state: ${{ steps.verify.outputs.state }}
      detail: ${{ steps.verify.outputs.detail }}
    steps:
      - name: read the pin back from tatara-helmfile main
        id: verify
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          : "${VERSION:?cd-release tag did not emit a version}"
          : "${TOKEN:?TATARA_CD_TOKEN required}"
          BARE="${VERSION#v}"
          PARENT="szymonrychu/tatara-helmfile"
          BRANCH="cd/deploy-train"
          # Test knobs (hack/test-cd-release-jobs.sh); CI takes the defaults.
          ATTEMPTS="${VERIFY_POLL_ATTEMPTS:-10}"
          NAP="${VERIFY_POLL_SLEEP:-30}"

          # curl's own --retry covers exactly the transient set that broke this
          # cascade (408/429/500/502/503/504). Attempt 8 of run 32035597231 died
          # on a bare `curl: (22) 503` and took the alarm down with it.
          api() {
            curl -sSf --retry 5 --retry-delay 3 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: ${2:-application/vnd.github+json}" \
              "https://api.github.com/$1"
          }
          raw() { api "$1" application/vnd.github.raw; }

          verdict() { # <state> <detail>
            echo "state=$1" >> "$GITHUB_OUTPUT"
            echo "detail=$2" >> "$GITHUB_OUTPUT"
          }

          # 0 pinned, 1 not pinned, 2 could not read. "Could not read" is NOT
          # "not pinned": conflating the two is what produced a false alarm.
          pinned_on() { # <ref>
            local hf vals
            hf="$(raw "repos/${PARENT}/contents/helmfile.yaml.gotmpl?ref=$1")" || return 2
            vals="$(raw "repos/${PARENT}/contents/values/tatara-operator/common.yaml?ref=$1")" || return 2
            printf '%s' "$hf" | grep -q "version: ${BARE}" || return 1
            printf '%s' "$vals" | grep -q "tag: \"${VERSION}\"" || return 1
          }

          # 1. Fast path. A healthy cascade lands in minutes, so poll briefly
          # and cheaply before spending a state query on it.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            rc=0; pinned_on main || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "cd: ${VERSION} is pinned on ${PARENT} main (attempt ${attempt})"
              verdict pinned "${VERSION} is pinned on ${PARENT} main."
              exit 0
            fi
            echo "cd: ${VERSION} not on ${PARENT} main yet (attempt ${attempt}/${ATTEMPTS}, read rc=${rc})"
            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$NAP"; fi
          done

          # 2. Not on main yet. ONE state query decides between "the cascade is
          # broken" and "the cascade is slow" - which the old 10m timeout could
          # not tell apart. On 2026-08-17 PR #423 was open and armed the whole
          # time and merged 28.8m after the bump, ~5m after this job gave up,
          # and the alarm still said the bump produced nothing (#622).
          #
          # The bound stays short on purpose. `concurrency: cd-release-tatara-
          # operator` with cancel-in-progress: false keeps only ONE pending run
          # per group, so waiting out a ~40m merge here means a third merge to
          # main evicts the queued run: a release that never gets tagged.
          if ! pr="$(api "repos/${PARENT}/pulls?state=open&head=${PARENT%%/*}:${BRANCH}")"; then
            echo "::error::CD pin fan-out: ${VERSION} is not on ${PARENT} main and ${BRANCH} could not be read from the forge."
            verdict forge-unreadable "${VERSION} is not on ${PARENT} main and the forge could not be queried for ${BRANCH}."
            exit 1
          fi
          num="$(printf '%s' "$pr" | jq -r '.[0].number // empty')"
          url="$(printf '%s' "$pr" | jq -r '.[0].html_url // empty')"
          head_sha="$(printf '%s' "$pr" | jq -r '.[0].head.sha // empty')"
          armed="$(printf '%s' "$pr" | jq -r 'if (.[0].auto_merge // null) == null then "" else "yes" end')"

          if [ -z "$num" ]; then
            echo "::error::CD pin fan-out is DOWN: ${VERSION} is not on ${PARENT} main and no open ${BRANCH} PR exists."
            echo "::error::The bump job pushed no pin at all, or pushed one and never opened a PR for it."
            verdict no-pr "No open ${BRANCH} PR exists on ${PARENT}, and ${VERSION} is not on its main."
            exit 1
          fi

          rc=0; pinned_on "$BRANCH" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::CD pin fan-out: ${PARENT}#${num} is open but its contents could not be read."
            verdict forge-unreadable "${PARENT}#${num} (${url}) is open but its contents could not be read from the forge."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} is open but does not carry ${VERSION}: ${url}"
            verdict pin-missing "${PARENT}#${num} (${url}) is open but does not carry ${VERSION}."
            exit 1
          fi

          if [ -z "$armed" ]; then
            echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} carries ${VERSION} but auto-merge is NOT armed; it will never merge on its own: ${url}"
            verdict not-armed "${PARENT}#${num} (${url}) carries ${VERSION} but auto-merge is not armed."
            exit 1
          fi

          red=""
          if [ -n "$head_sha" ]; then
            # per_page=100: check-runs pages at 30 by default, and a red run on
            # page 2 would read as "green, in flight" - the exact false-negative
            # this verdict exists to remove.
            red="$(api "repos/${PARENT}/commits/${head_sha}/check-runs?per_page=100" \
              | jq -r '[.check_runs[]
                        | select(.conclusion == "failure" or .conclusion == "timed_out"
                                 or .conclusion == "cancelled" or .conclusion == "action_required")
                        | .name] | join(", ")')"
          fi
          if [ -n "$red" ]; then
            echo "::error::CD pin fan-out is STUCK: ${PARENT}#${num} carries ${VERSION} and is armed, but these checks are red: ${red} (${url})"
            echo "::error::Auto-merge never fires on a red required check, so this pin will not land without a human."
            verdict checks-red "${PARENT}#${num} (${url}) carries ${VERSION} and is armed, but these checks are red: ${red}."
            exit 1
          fi

          # Open, correct, armed and not red: in flight, not stalled. The
          # operator owns the rest of the wait - deploy_stage.go bounds it at
          # deployPinFanoutDeadline (45m) and parks at parkReason=deploy-timeout,
          # which is already a critical alert. Failing here would only be a
          # second, louder, wrong alarm.
          echo "::notice::${PARENT}#${num} carries ${VERSION}, is armed and has no red check: ${url}"
          echo "::notice::Leaving the remaining wait to the operator's 45m deployPinFanoutDeadline."
          verdict in-flight "${PARENT}#${num} (${url}) carries ${VERSION}, is armed and has no red check; it was still in flight when this job ran."
          exit 0

  # LOUD ON FAILURE. A red workflow run nobody looks at is what let #512 sit for
  # ~9h, so the alarm is filed where the platform already reads: an issue on this
  # repo, which the incident pipeline picks up. Deduped by title so a repeated
  # failure comments rather than opening a new tracker each release.
  fanout-alarm:
    needs: [tag, publish, bump, verify-pin]
    if: >-
      always() && needs.tag.result == 'success' &&
      (needs.bump.result != 'success' || needs.verify-pin.result != 'success')
    runs-on: tatara-operator
    steps:
      - name: file the stalled CD pin fan-out
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMP_RESULT: ${{ needs.bump.result }}
          VERIFY_RESULT: ${{ needs.verify-pin.result }}
          VERIFY_STATE: ${{ needs.verify-pin.outputs.state }}
          VERIFY_DETAIL: ${{ needs.verify-pin.outputs.detail }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          : "${TOKEN:?TATARA_CD_TOKEN required}"
          TITLE="CD pin fan-out stalled: ${VERSION} is not pinned in tatara-helmfile"

          # Same retry as verify-pin. Attempt 8 of run 32035597231 lost its
          # alarm to a bare `curl: (22) 503` - the one job whose whole purpose
          # is to be heard was the one that went silent.
          api() {
            curl -sSf --retry 5 --retry-delay 3 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }
          post() { # <path>; JSON body on stdin
            curl -sSf --retry 5 --retry-delay 3 -X POST \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d @- "https://api.github.com/$1"
          }

          # The remedy depends on what verify-pin actually SAW. The old text was
          # unconditional ("the bump action produced nothing") and was wrong on
          # 2026-08-17: PR #423 existed, was armed, and merged. It also named a
          # `cd: bump <component> to <version>` PR, which the terminal hop never
          # opens - it coalesces every component into one `cd: deploy-train` PR -
          # so it sent a human hunting for something that cannot exist.
          case "${VERIFY_STATE:-}" in
            no-pr)
              FIX="No open \`cd/deploy-train\` PR exists on tatara-helmfile."
              FIX="${FIX} Apply the pin by hand (the chart versions in \`helmfile.yaml.gotmpl\`"
              FIX="${FIX} plus the image tag in \`values/tatara-operator/common.yaml\`), open that"
              FIX="${FIX} PR against main and merge it, then find why the \`cd-release\` bump"
              FIX="${FIX} action opened none."
              ;;
            pin-missing | not-armed | checks-red)
              FIX="The \`cd/deploy-train\` PR named above exists; drive it to merge, then"
              FIX="${FIX} fix what stopped it. The terminal hop coalesces every component into"
              FIX="${FIX} that ONE PR, so there is no per-component \`cd: bump\` PR to look for."
              ;;
            forge-unreadable)
              FIX="The forge could not be read, so the fan-out state is UNKNOWN and may"
              FIX="${FIX} well be healthy. Check \`cd/deploy-train\` on tatara-helmfile before"
              FIX="${FIX} assuming anything is broken."
              ;;
            *)
              FIX="\`verify-pin\` never reached a verdict (the \`bump\` job failed first), so"
              FIX="${FIX} no fan-out state was observed. Read the \`bump\` job's log in the run"
              FIX="${FIX} above, then check \`cd/deploy-train\` on tatara-helmfile."
              ;;
          esac

          BODY=$(printf '%s\n' \
            "The release train cut and published \`${VERSION}\`, but the pin was not on tatara-helmfile's main when this run checked." \
            "" \
            "- bump job: \`${BUMP_RESULT}\`" \
            "- pin verification: \`${VERIFY_RESULT}\`" \
            "- observed fan-out state: \`${VERIFY_STATE:-not observed}\`" \
            "- ${VERIFY_DETAIL:-No fan-out state was observed.}" \
            "- run: ${RUN_URL}" \
            "" \
            "**Nothing can deploy while this is broken.** Every task that reaches" \
            "\`stage=deploying\` polls a pin that will never materialise. The operator now" \
            "bounds that wait and parks at \`deploy-timeout\` (issue #512), so merged work is" \
            "retryable rather than discarded - but it does not ship until this is repaired." \
            "" \
            "Fix: ${FIX}")

          # Plain /issues, not /search/issues: search is rate-limited separately
          # and far more tightly, and it was 503ing throughout the 2026-08-17
          # outage. /issues returns PULL REQUESTS too, hence the filter - a
          # bot-authored PR whose title happens to match is not the tracker.
          existing=$(api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r --arg t "CD pin fan-out stalled" \
              '[.[] | select(has("pull_request") | not) | select(.title | startswith($t))][0].number // empty')
          if [ -n "$existing" ]; then
            jq -n --arg b "$BODY" '{body:$b}' \
              | post "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" >/dev/null
            echo "commented on existing fan-out tracker #${existing}"
          else
            jq -n --arg t "$TITLE" --arg b "$BODY" '{title:$t, body:$b}' \
              | post "repos/${GITHUB_REPOSITORY}/issues" >/dev/null
            echo "opened a fan-out tracker"
          fi
